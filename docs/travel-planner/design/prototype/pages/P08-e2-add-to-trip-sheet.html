<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390">
  <title>加入行程 · 去哪玩</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../components.css">
</head>
<body>
<script src="../icons.js"></script>
<script src="../sample-data.js"></script>
<main class="screen">

<div class="sysbar"><span>9:41</span><span>去哪玩</span></div>
<div class="login-stage">
  <div class="screen-body">
    <p class="dim">西溪湿地 · 尚未加入</p>
    <a class="btn btn-primary" href="P08-e2-add-to-trip-sheet.html">加入行程</a>
  </div>
  <div class="stage-dim"></div>
  <div class="login-sheet" role="dialog" aria-label="选择加入位置">
    <div class="sheet-handle" aria-hidden="true"></div>
    <h2 class="t-headline">加到哪一天</h2>
    <div class="demo-row">
      <span class="chip is-selected">第 1 天</span>
      <span class="chip">第 2 天</span>
    </div>
    <p class="t-caption">按距离，建议排在灵隐寺后面。从灵隐打车约 25 分钟、8 公里。</p>
    <div class="stack">
      <span class="btn btn-secondary">灵隐寺之后 · 建议</span>
      <span class="btn btn-secondary">楼外楼之后</span>
      <span class="btn btn-secondary">西湖之后</span>
    </div>
    <div class="sheet-actions">
      <a class="btn btn-secondary" href="P08-e-poi-add.html">取消</a>
      <a class="btn btn-primary" href="P08-e3-added.html">确认加入</a>
    </div>
    <div class="home-indicator" aria-hidden="true"></div>
  </div>
</div>

</main>
</body>
</html>
